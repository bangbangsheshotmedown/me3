on:
  push:
    branches:
      - main
name: CI

permissions:
  contents: write

env:
  RUSTC_BOOTSTRAP: 1

jobs:
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e3f713f2d8f53843e71c69a996d56f51aa9adfb9 # v2.14.1
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc,x86_64-unknown-linux-gnu

      - uses: ./.github/actions/setup-windows-toolchain
      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
        with:
          shared-key: me3-build
          save-if: ${{ github.event_name == 'push' }}

      - name: Install pandoc
        uses: pandoc/actions/setup@86321b6dd4675f5014c611e05088e10d4939e09e # v1.1.1
        with:
          version: 2.19

      - name: Create distributions and installer
        run: |
          make all

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: me3-linux-artifacts
          path: |
            installer.sh
            out/me3_installer.exe
            out/me3-linux-amd64.tar.gz

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    env:
      RUSTC_BOOTSTRAP: 1
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e3f713f2d8f53843e71c69a996d56f51aa9adfb9 # v2.14.1
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
        with:
          shared-key: me3-build
          save-if: ${{ github.event_name == 'push' }}

      - name: Create Windows distribution
        run: |
          make dist-windows

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: me3-windows-artifacts
          path: |
            out/me3-windows-amd64.zip

  create-nightly-release:
    name: Create Nightly Release
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Download Linux artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: me3-linux-artifacts
          path: .
      - name: Download Windows artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: me3-windows-artifacts
          path: .
      - name: Create or update nightly release
        run: |
          # Delete old nightly release if exists
          if gh release view nightly >/dev/null 2>&1; then
            gh release delete nightly --yes
          fi
          # Create new nightly release
          gh release create nightly --title "Nightly Build" --notes "Latest build artifacts from commit ${{ github.sha }}" --prerelease \
            installer.sh#installer.sh \
            me3_installer.exe#me3_installer.exe \
            me3-linux-amd64.tar.gz#me3-linux-amd64.tar.gz \
            me3-windows-amd64.zip#me3-windows-amd64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
